name: "Build and publish common libs"
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
env:
  "IMAGE": "ghcr.io/${{ github.repository }}:${{ github.sha }}"
jobs:
  "build":
    name: "build"
    runs-on: "ubuntu-latest"
    env:
      NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      SKIP_YARN_COREPACK_CHECK: true
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-node@v7"
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
      - name: Enable Corepack
        run: corepack enable
      - name: "install dependencies"
        run: "yarn --immutable"
      - name: "test packages"
        run: "yarn workspaces foreach --all --exclude . run test"
      - name: "build packages"
        run: "yarn workspaces foreach --all --exclude . run build"
      - name: "Login"
        run: |
          git config user.email "aap-innbygger@nav.no"
          git config user.name "Team Innbygger"
          git remote set-url origin https://github-actions[bot]:$GITHUB_TOKEN@github.com/navikt/aap-felles-innbygger.git
          git fetch origin
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - name: "Create a .npmrc file for the github package repository"
        uses: "FerLuisxd/create-npmrc@3"
        with:
          org_name: "navikt"
        env:
          AUTH_TOKEN: "${{secrets.GITHUB_TOKEN}}"
      - name: Create changeset from commit message
        if: >-
          contains(github.event.head_commit.message, 'MINOR') ||
          contains(github.event.head_commit.message, 'MAJOR') ||
          contains(github.event.head_commit.message, 'PATCH')
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [[ "$COMMIT_MESSAGE" == *"MAJOR"* ]]; then
            release_type="major"
          elif [[ "$COMMIT_MESSAGE" == *"MINOR"* ]]; then
            release_type="minor"
          else
            release_type="patch"
          fi

          cat > ".changeset/automatic-${GITHUB_RUN_ID}.md" <<EOF
          ---
          '@navikt/aap-felles-css': ${release_type}
          '@navikt/aap-felles-prettier': ${release_type}
          '@navikt/aap-felles-utils': ${release_type}
          '@navikt/eslint-config-aap': ${release_type}
          ---

          Automated ${release_type} release triggered by commit ${GITHUB_SHA}.
          EOF
      - name: Create release Pull Request or publish to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn changeset version
          publish: yarn changeset publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
